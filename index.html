<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07080C">
    <title>وصّلني</title>
    <link rel="icon" href="icon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
         :root {
            color-scheme: dark;
            --bg: #07080C;
            --card: #0F1118;
            --c2: #161924;
            --bd: #222637;
            --tx: #EAF0FF;
            --mut: #8A94B2;
            --pri: #2E6BFF;
            --pri2: #5B8CFF;
            --cy: #35D0FF;
            --red: #FF4D6A;
            --glow: 0 0 24px rgba(46, 107, 255, .35)
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }
        
        html,
        body {
            margin: 0;
            background: var(--bg)
        }
        
        body {
            color: var(--tx);
            font-family: Cairo, Tahoma, Arial, sans-serif;
            line-height: 1.6;
            padding-top: env(safe-area-inset-top, 0)
        }
        
        .w {
            max-width: 560px;
            margin: 0 auto;
            padding: 12px 14px calc(96px + env(safe-area-inset-bottom, 0))
        }
        
        .sub {
            color: var(--mut);
            font-size: 13px
        }
        
        .r {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }
        
        .c {
            text-align: center
        }
        
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            color: var(--pri2);
            text-shadow: 0 0 18px rgba(46, 107, 255, .6)
        }
        
        .logo em {
            font-style: normal;
            filter: drop-shadow(0 0 10px rgba(46, 107, 255, .8))
        }
        
        .hd {
            padding: 6px 0 10px
        }
        
        .ic {
            background: var(--card);
            border: 1px solid var(--bd);
            color: var(--tx);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 20px;
            flex: none;
            cursor: pointer
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 18px;
            padding: 14px;
            margin: 10px 0
        }
        
        label {
            display: block;
            font-size: 13px;
            color: var(--mut);
            margin: 10px 0 4px
        }
        
        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--bd);
            border-radius: 12px;
            background: var(--c2);
            color: var(--tx);
            font: inherit
        }
        
        input:focus,
        select:focus {
            outline: 0;
            border-color: var(--pri);
            box-shadow: var(--glow)
        }
        
        .num {
            direction: ltr;
            text-align: right
        }
        
        .b {
            border: 0;
            background: var(--pri);
            color: #fff;
            padding: 13px;
            border-radius: 14px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            box-shadow: var(--glow)
        }
        
        .b:disabled {
            opacity: .4;
            box-shadow: none
        }
        
        .b.s {
            width: auto;
            padding: 8px 16px;
            margin: 0
        }
        
        .b.l {
            background: none;
            color: var(--pri2);
            border: 1px solid var(--pri);
            box-shadow: none
        }
        
        .b.d {
            background: var(--red);
            box-shadow: none
        }
        
        .t {
            font-size: 12px;
            padding: 3px 11px;
            border-radius: 20px;
            background: rgba(46, 107, 255, .15);
            color: var(--pri2);
            font-weight: 800;
            white-space: nowrap
        }
        
        .t.ok {
            background: rgba(53, 208, 255, .14);
            color: var(--cy)
        }
        
        .vb {
            font-size: 11px;
            color: var(--cy);
            background: rgba(53, 208, 255, .12);
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 800
        }
        
        .bid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--bd);
            background: var(--c2);
            border-radius: 14px;
            padding: 10px;
            margin-top: 8px
        }
        
        .p {
            font-weight: 800;
            font-size: 18px
        }
        
        .big {
            font-size: 26px;
            font-weight: 800;
            color: var(--pri2)
        }
        
        .g {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }
        
        .code {
            font-size: 22px;
            letter-spacing: 5px;
            font-weight: 800;
            background: var(--c2);
            color: var(--cy);
            border: 1px dashed var(--pri);
            border-radius: 12px;
            padding: 4px 14px
        }
        
        .e {
            text-align: center;
            color: var(--mut);
            padding: 26px 0
        }
        
        .map {
            height: 190px;
            border-radius: 14px;
            margin-top: 10px;
            border: 1px solid var(--bd)
        }
        
        .pin {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 14px;
            border: 2px solid #fff;
            box-shadow: 0 0 14px rgba(46, 107, 255, .8)
        }
        
        .pin.a {
            background: #2E6BFF;
            color: #fff
        }
        
        .pin.b {
            background: #fff;
            color: #07080C
        }
        
        .pin.c {
            background: #07080C;
            border-color: #2E6BFF
        }
        
        .leaflet-container {
            background: #0b0d13
        }
        
        .leaflet-control-attribution {
            background: rgba(7, 8, 12, .7)!important;
            color: var(--mut)!important
        }
        
        .leaflet-control-attribution a {
            color: var(--pri2)!important
        }
        
        .stp {
            display: flex;
            gap: 6px;
            margin-top: 10px
        }
        
        .stp i {
            flex: 1;
            height: 5px;
            border-radius: 5px;
            background: var(--bd)
        }
        
        .stp i.on {
            background: var(--pri);
            box-shadow: var(--glow)
        }
        
        .av {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--c2);
            border: 2px solid var(--pri);
            flex: none;
            display: inline-grid;
            place-items: center;
            font-weight: 800;
            color: var(--pri2)
        }
        
        .av.big {
            width: 88px;
            height: 88px;
            font-size: 34px
        }
        
        .rc {
            display: flex;
            gap: 10px;
            margin-top: 6px
        }
        
        .rc button {
            flex: 1;
            padding: 12px 6px;
            border-radius: 14px;
            border: 1.5px solid var(--bd);
            background: var(--c2);
            color: var(--mut);
            font: inherit;
            font-weight: 700;
            cursor: pointer
        }
        
        .rc button.on {
            border-color: var(--pri);
            color: var(--tx);
            box-shadow: var(--glow)
        }
        
        .rc span {
            display: block;
            font-size: 26px
        }
        
        .pwr {
            position: relative
        }
        
        .pwr button {
            position: absolute;
            left: 6px;
            top: 6px;
            border: 0;
            background: none;
            font-size: 18px;
            color: var(--mut);
            padding: 6px
        }
        
        .ph {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border: 1.5px dashed var(--pri);
            border-radius: 14px;
            background: var(--c2);
            min-height: 128px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            overflow: hidden;
            margin: 0;
            color: var(--tx)
        }
        
        .ph.ok {
            border-style: solid;
            border-color: var(--cy)
        }
        
        .ph img {
            max-width: 100%;
            max-height: 96px;
            border-radius: 8px
        }
        
        .ph span {
            font-size: 28px
        }
        
        .ph small {
            color: var(--mut);
            font-size: 11px
        }
        
        .th {
            width: 31%;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--bd);
            background: var(--c2);
            cursor: zoom-in
        }
        
        .pg {
            height: 6px;
            border-radius: 6px;
            background: var(--bd);
            overflow: hidden
        }
        
        .pg b {
            display: block;
            height: 100%;
            background: var(--pri);
            transition: width .3s
        }
        
        .ck {
            font-size: 13px;
            color: var(--mut);
            padding: 2px 0
        }
        
        .ck.y {
            color: var(--cy)
        }
        
        .zm {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .92);
            z-index: 9998;
            display: grid;
            place-items: center
        }
        
        .zm img {
            max-width: 96%;
            max-height: 92%;
            border-radius: 10px
        }
        
        #ld {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            z-index: 9999;
            display: none;
            background: linear-gradient(90deg, transparent, var(--pri), var(--cy), transparent);
            background-size: 50% 100%;
            background-repeat: no-repeat;
            animation: ld 1s linear infinite
        }
        
        @keyframes ld {
            from {
                background-position: -50% 0
            }
            to {
                background-position: 150% 0
            }
        }
        
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 17, 24, .96);
            border-top: 1px solid var(--bd);
            display: flex;
            justify-content: center;
            padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0));
            backdrop-filter: blur(10px);
            z-index: 50
        }
        
        nav button {
            flex: 1;
            max-width: 200px;
            background: none;
            border: 0;
            color: var(--mut);
            font: inherit;
            font-size: 12px;
            padding: 6px;
            position: relative
        }
        
        nav button span {
            display: block;
            font-size: 20px
        }
        
        nav .on {
            color: var(--pri2)
        }
        
        nav .on span {
            filter: drop-shadow(0 0 8px var(--pri))
        }
        
        nav i {
            position: absolute;
            top: 2px;
            right: 30%;
            background: var(--red);
            color: #fff;
            font-style: normal;
            font-size: 10px;
            min-width: 16px;
            border-radius: 8px;
            padding: 0 4px
        }
        
        #toast {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0));
            left: 50%;
            transform: translateX(-50%);
            background: var(--pri);
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            display: none;
            z-index: 9999;
            font-weight: 600;
            box-shadow: var(--glow);
            max-width: 92%;
            text-align: center
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--bd);
            border-radius: 12px;
            background: var(--c2);
            color: var(--tx);
            font: inherit;
            min-height: 90px;
            resize: vertical
        }
        
        textarea:focus {
            outline: 0;
            border-color: var(--pri);
            box-shadow: var(--glow)
        }
        
        .chip {
            border: 0;
            cursor: pointer;
            font: inherit
        }
        
        .chip.on {
            background: var(--pri);
            color: #fff
        }
    </style>
</head>

<body>
    <div id="ld"></div>
    <div class="w" id="app"></div>
    <div id="toast"></div>
    <script>
        // عنوان الخادم: بيتوصّل لوحده من غير أي إعداد ومن غير رسائل للمستخدم (يجرّب: العنوان هنا ← آخر عنوان نجح ← نفس الدومين ← الجهاز نفسه localhost).
        // لو الخادم مستضاف على الإنترنت حط عنوانه هنا مرة واحدة (https://...) وهيشتغل من أي جهاز أو تطبيق بدون روابط.
        const API_URL = "https://waslni-production-e28fe835.up.railway.app";
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        let API = "",
            SRV = null,
            CONN = null;
        try {
            localStorage.removeItem("api")
        } catch (e) {}
        const NOSRV = () => false;
        const srvCands = () => {
            const L = [],
                add = u => {
                    if (u != null && !L.includes(u)) L.push(u)
                };
            add(API_URL || null);
            try {
                add(localStorage.getItem("srv"))
            } catch (e) {}
            if (/^https?:$/.test(location.protocol)) add("");
            [3000, 8080, 5000].forEach(p => {
                add("http://localhost:" + p);
                add("http://127.0.0.1:" + p)
            });
            return L
        };
        async function srvProbe(b) {
            const c = new AbortController(),
                t = setTimeout(() => c.abort(), 4000);
            try {
                const r = await fetch(b + "/health", {
                        signal: c.signal,
                        cache: "no-store"
                    }),
                    j = await r.json();
                return r.ok && !!j && j.ok === true
            } catch (e) {
                return false
            } finally {
                clearTimeout(t)
            }
        }

        function connect() {
            if (CONN) return CONN;
            CONN = (async() => {
                for (let n = 0;; n++) {
                    const L = srvCands(),
                        res = await Promise.all(L.map(srvProbe)),
                        i = res.indexOf(true);
                    if (i >= 0) {
                        API = L[i];
                        SRV = true;
                        try {
                            localStorage.setItem("srv", API)
                        } catch (e) {}
                        CONN = null;
                        if (busy <= 0) $("#ld").style.display = "none";
                        return true
                    }
                    SRV = false;
                    $("#ld").style.display = "block";
                    await sleep(Math.min(800 + n * 700, 5000))
                }
            })();
            CONN.then(() => {
                if (typeof onSrv == "function") onSrv()
            });
            return CONN
        }
        const srvReady = async ms => {
            if (SRV === true) return true;
            const p = connect();
            return Promise.race([p, sleep(ms).then(() => false)])
        };
        const netErr = () => {
            const e = new Error("حصلت مشكلة مؤقتة، جرّب تاني بعد لحظات");
            e.net = true;
            return e
        };
        const $ = s => document.querySelector(s),
            esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;"
            }[c]));
        const ar2en = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "");
        const money = n => Math.round(Number(n) * 100) / 100 + " ج.م",
            HAS = typeof L !== "undefined",
            vib = () => navigator.vibrate && navigator.vibrate(30);
        const ST = {
            bidding: "مفتوح للعروض",
            accepted: "في الطريق للاستلام",
            picked_up: "في الطريق للتسليم",
            delivered: "تم التسليم",
            cancelled: "ملغي"
        };
        const VEH = {
            scooter: "🛵 موتوسيكل",
            bike: "🚲 دراجة",
            car: "🚗 سيارة",
            walk: "🚶 مشي"
        };
        const GOV = {
            "01": "القاهرة",
            "02": "الإسكندرية",
            "03": "بورسعيد",
            "04": "السويس",
            "11": "دمياط",
            "12": "الدقهلية",
            "13": "الشرقية",
            "14": "القليوبية",
            "15": "كفر الشيخ",
            "16": "الغربية",
            "17": "المنوفية",
            "18": "البحيرة",
            "19": "الإسماعيلية",
            "21": "الجيزة",
            "22": "بني سويف",
            "23": "الفيوم",
            "24": "المنيا",
            "25": "أسيوط",
            "26": "سوهاج",
            "27": "قنا",
            "28": "أسوان",
            "29": "الأقصر",
            "31": "البحر الأحمر",
            "32": "الوادي الجديد",
            "33": "مطروح",
            "34": "شمال سيناء",
            "35": "جنوب سيناء",
            "88": "خارج الجمهورية"
        };
        const LOGO = (s, t = 1) => `<span class="logo" style="font-size:${s}px"><em>🛵</em>${t?"وصّلني":""}</span>`;
        const hi = () => new Date().getHours() < 12 ? "صباح الخير" : "مساء الخير";
        const nidInfo = n => {
            if (!/^[23]\d{13}$/.test(n)) return null;
            const y = (n[0] == "2" ? 1900 : 2000) + +n.slice(1, 3),
                m = +n.slice(3, 5),
                d = +n.slice(5, 7),
                t = new Date(Date.UTC(y, m - 1, d));
            if (t.getUTCFullYear() != y || t.getUTCMonth() != m - 1 || t.getUTCDate() != d || !GOV[n.slice(7, 9)]) return null;
            const a = (Date.now() - t) / 31557600000;
            if (a < 18 || a > 75) return null;
            return {
                y,
                m,
                d,
                g: GOV[n.slice(7, 9)],
                f: (+n[12]) % 2 == 0
            }
        };
        const freshV = () => ({
            nid: "",
            front: null,
            back: null,
            selfie: null,
            veh: "scooter",
            plate: "",
            agree: false,
            open: false
        });
        let U = null,
            ME = null,
            tok = "",
            tab = "",
            mode = "login",
            RL = "customer",
            AF = {
                nm: "",
                ph: "",
                pw: "",
                ac: ""
            },
            CFG = {
                rate: 10
            },
            V = freshV(),
            BD = {};
        let D = {
                orders: [],

            },

        try {

            U = JSON.parse(localStorage.getItem("usr") || "null");
            rated = JSON.parse(localStorage.getItem("rated") || "[]")
        } catch (e) {}
        if (U) tab = U.role == "courier" ? "open" : U.role == "admin" ? "stats" : "mine";
        let AD = {

                uf: "all",
                uq: "",

                audit: [],
                badge: {

                }
            },
            NT = [],

        const freshOT = () => ({
            sent: false,

            code: "",
            token: "",
            wait: 0
        });
        let PF = null,
            AV = null,
            OT = freshOT();
        const due = (k, ms = 15000) => {
            const n = Date.now();
            if (TT[k] && n - TT[k] < ms) return false;
            TT[k] = n;
            return true
        };
        const fmtN = n => Number(n || 0).toLocaleString("en-US", {
                maximumFractionDigits: 1
            }),
            dt = x => x ? new Date(x).toLocaleString("ar-EG", {
                day: "numeric",
                month: "short",
                hour: "2-digit",
                minute: "2-digit"
            }) : "";
        const RN = {
                customer: "عميل",
                courier: "مندوب",
                admin: "إدارة"
            },
            VS = {
                pending: "قيد المراجعة",
                approved: "موثّق",
                rejected: "مرفوض"
            },
            CT = {
                delay: "تأخير",
                behavior: "سلوك غير لائق",
                damaged: "تلف أو فقد",
                payment: "مشكلة في الدفع",
                other: "أخرى"
            };
        const AUD = {
            commission: "غيّر العمولة",
            verify_approve: "وافق على توثيق",
            verify_reject: "رفض توثيق",
            block: "أوقف حساب",
            unblock: "رفع إيقاف",
            cancel_order: "ألغى طلب",
            resolve_complaint: "عالج بلاغ",
            export: "صدّر ملف"
        };

        function go(t) {
            tab = t;
            TT = {};
            refresh()
        }
        // نافذة سفلية موحّدة للإدخال والتأكيد
        function sheet(t, body, ok, label = "تأكيد") {
            const d = document.createElement("div");
            d.className = "zm";
            d.style.alignItems = "end";
            d.innerHTML = `<div class="card" style="width:100%;max-width:560px;border-radius:20px 20px 0 0;margin:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0))"><b>${t}</b>${body}<div class="g" style="margin-top:12px"><button class="b l" id="sx" style="margin:0">إلغاء</button><button class="b" id="so" style="margin:0">${label}</button></div></div>`;
            document.body.appendChild(d);
            d.querySelector("#sx").onclick = () => d.remove();

                            method,

                                "Content-Type": "application/json",

                        continue

                    if (r.status == 502 || r.status == 503 || (r.status == 504 && method == "GET")) {
                        SRV = false;
                        connect();
                        if (a >= 2) throw netErr();
                        await sleep(1500);
                        continue

                    const j = await r.json().catch(() => ({}));
                    if (r.status == 401 && tok) {
                        logout();
                        throw new Error("سجّل الدخول تاني")
                    }
                    if (!r.ok) {

                        e.code = j.code;
                        throw e

                }
            } finally {

            }

function custView(){if(!D.orders.length)return `<div class="e">📭<br>لسه معندكش طلبات<br><button class="b s" style="margin-top:12px" onclick="tab='new';refresh()">اعمل أول طلب</button></div>`;
 return D.orders.map(o=>{const t=D.track[o.id],s=["accepted","picked_up","delivered"].indexOf(o.status);

  if(o.status=="bidding"){const b=D.bids[o.id]||[];h+=b.length?`<div class="sub" style="margin-top:8px">${b.length} عرض — اختار الأنسب:</div>`+b.map(x=>`<div class="bid"><div class="r" style="gap:10px;justify-content:flex-start">${av(x.courier_id)}<div><b>${esc(x.name)}</b> ${x.is_verified?`<span class="vb">✔ موثّق</span>`:""}<div class="sub">⭐${Number(x.rating_avg).toFixed(1)} • ${VEH[x.vehicle_type]||""} • ${x.eta_minutes} د</div></div></div><div style="text-align:left"><div class="p">${money(x.price)}</div><button class="b s" onclick="accept('${o.id}','${x.id}')">اقبل</button></div></div>`).join(""):`<div class="e">⏳ بنستنى عروض المناديب…<br><span class="sub">هيجيلك إشعار أول ما يوصل عرض</span></div>`}

   if(o.status!="delivered"){if(o.pickup_lat!=null)h+=slot("o"+o.id,{p:[o.pickup_lat,o.pickup_lng],d:[o.dropoff_lat,o.dropoff_lng],c:t&&t.courier_location&&[t.courier_location.lat,t.courier_location.lng]});
    h+=`<div class="r" style="margin-top:10px"><span class="sub">كود التسليم — قوله للمندوب وقت الاستلام:</span><span class="code">${o.delivery_code}</span></div>`}
   else if(!rated.includes(o.id))h+=`<div class="r" style="margin-top:10px"><span>قيّم المندوب:</span><span>${[1,2,3,4,5].map(n=>`<span style="font-size:28px;cursor:pointer;color:var(--cy)" onclick="rate('${o.id}',${n})">☆</span>`).join("")}</span></div>`}
  return h+orderActs(o,"c")+"</div>"}).join("")}

 <div class="g" style="margin-top:8px"><div class="sub">السعر<div class="p" style="color:var(--tx)">${money(o.final_price)}</div></div><div class="sub">صافي ربحك<div class="p" style="color:var(--cy)">${money(o.courier_earning)}</div></div></div><div class="sub">عمولة المنصة ${o.commission_rate}% = ${money(o.commission_amount)}</div>
 ${act&&o.pickup_lat!=null?slot("j"+o.id,{p:[o.pickup_lat,o.pickup_lng],d:[o.dropoff_lat,o.dropoff_lng]})+`<a class="b" style="display:block;text-align:center;text-decoration:none" href="https://www.google.com/maps/dir/?api=1&destination=${dst[0]},${dst[1]}" target="_blank">🧭 ابدأ الملاحة</a>`:""}
 ${o.status=="accepted"?`<button class="b" onclick="pick('${o.id}')">تم استلام الطلب</button>`:""}
 ${o.status=="picked_up"?`<label>كود التسليم (اطلبه من المستلم)</label><div class="r"><input class="num" id="cd${o.id}" inputmode="numeric" maxlength="4" placeholder="••••"><button class="b s" onclick="deliver('${o.id}')">سلّم</button></div>`:""}${orderActs(o,"m")}</div>`}).join("");
function bars(rows,cols,w=300,h=110){const mx=Math.max(1,...rows.flatMap(r=>cols.map(c=>+r[c.k]||0))),n=rows.length||1,bw=(w-10)/n,g=bw*.8/cols.length;
 return `<svg viewBox="0 0 ${w} ${h+18}" style="width:100%;height:auto;margin-top:8px">${rows.map((r,i)=>cols.map((c,j)=>{const v=+r[c.k]||0,hh=v/mx*h;return `<rect x="${5+i*bw+j*g}" y="${h-hh}" width="${Math.max(1,g-1)}" height="${hh}" rx="1.5" fill="${c.c}"><title>${r.day}: ${v}</title></rect>`}).join("")).join("")}${rows.map((r,i)=>i%Math.ceil(n/6)==0?`<text x="${5+i*bw}" y="${h+13}" font-size="8" fill="#8A94B2">${r.day.slice(8,10)}/${r.day.slice(5,7)}</text>`:"").join("")}</svg>`}

 if(!d)return chips+`<div class="e">جاري التحميل…</div>`;

function cropSquare(f,sz=512){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const m=Math.min(i.width,i.height);if(m<200)return no(new Error("الصورة صغيرة، اختار صورة أوضح"));const c=document.createElement("canvas");c.width=c.height=sz;c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,sz,sz);ok(c.toDataURL("image/jpeg",.85))};i.onerror=()=>no(new Error("تعذّر قراءة الصورة"));i.src=URL.createObjectURL(f)})}

   if(U.role=="customer"){await Promise.all(D.orders.map(async o=>{if(o.status=="bidding")D.bids[o.id]=await api(`/orders/${o.id}/bids`);else if(o.status!="delivered"||!D.track[o.id])D.track[o.id]=await api(`/orders/${o.id}/track`)}));

 render()}
function render(force){const a=document.activeElement;if(!force&&a&&/INPUT|SELECT/.test(a.tagName)&&$("#app").contains(a))return;
